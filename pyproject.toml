[project]
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.45,<2",
  "langchain-core>=1.0,<2",
  "langchain-community>=0.4,<0.6",
  "langchain-openai>=0.3",     # supports OpenAI v2
  "openai>=2,<3",
  "chromadb>=1.2,<2",
  "tiktoken>=0.6,<1",
  "wikipedia>=1.4,<2",
  "pandas>=2.2,<3",
  "google-api-python-client>=2.120,<3"
  # If you ever add pysqlite3 again, make it Linux-only:
  # "pysqlite3-binary>=0.5,<1; sys_platform != 'win32'",
]

[tool.uv]
# empty is fine; uv will still generate uv.lock
